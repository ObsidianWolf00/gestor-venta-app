<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#1f6feb">
        <title>Gestor de venta</title>
        <link rel="stylesheet" href="estilos.css">
        <link rel="manifest" href="./manifest.webmanifest">
    </head>
    <body>
        <h1>Mi catálogo</h1>
        <section id="copia">
            <h2>Copia de seguridad</h2>
            <button type="button" id="exportar">Exportar copia</button>
            <label>Importar copia <input type="file" id="importar"></label>
            <p>La copia incluye productos y fotos.</p>
        </section>
        <section id="gestionGrupos">
            <h2>Mis grupos de gestores</h2>
            <form id="formularioGrupo">
                <label>Nombre del grupo
                    <input id="nombreGrupo" required>
                </label>
                <label>
                    <input type="checkbox" id="permiteAumento">
                    Permite aumentar el precio
                </label>
                <label>
                    <input type="checkbox" id="grupoActivo" checked>
                    Grupo activo
                </label>
                <label>Notas (opcional)
                    <textarea id="notasGrupo" rows="2"></textarea>
                </label>
                <button type="submit" id="botonGuardarGrupo">Guardar grupo</button>
                <button type="button" id="botonCancelarGrupo" hidden>Cancelar</button>
            </form>
            <div id="listaGrupos"></div>
        </section>
        <h2>Añadir producto</h2>
        <form id="formulario">
            <label>Nombre <input id="nombre" required></label>
            <label>Marca (opcional) <input id="marca"></label>
            <label>Características (Una por línea)
                <textarea id="caracteristicas" rows="3"></textarea>
            </label>
            <label>Precio <input id="precio" type="number" min="0" step="any" required></label>
            <label>Moneda del precio
                <select id="monedaPrecio"><option>USD</option><option>CUP</option></select>
            </label>
            <label>Disponibilidad <input id="disponibilidad"></label>
            <label>Grupo de gestores
                <select id="grupoProducto">
                    <option value="">Sin grupo</option>
                </select>
            </label>
            <label>Comisión <input id="comision" type="number" min="0" step="any" required></label>
            <label>Moneda de la comisión
                <select id="monedaComision"><option>CUP</option><option>USD</option></select>
            </label>
            <label>Fotos <input type="file" id="fotos" accept="image/*" multiple></label>
            <div id="vistaPrevia"></div>
            <button type="submit" id="botonGuardar">Guardar producto</button>
            <button type="button" id="botonCancelar" hidden>Cancelar</button>
        </form>
        <section id="panelAnuncio" hidden>
            <h2>Anuncio</h2>
            <label>Estilo
                <select id="estiloAnuncio">
                    <option value="simple">Simple</option>
                    <option value="llamativo">Llamativo</option>
                </select>
            </label>
            <button type="button" id="regenerarAnuncio">Regenerar</button>
            <textarea id="textoAnuncio" rows="10"></textarea>
            <button type="button" id="cerrarAnuncio">Cerrar</button>
            <button type="button" id="copiarAnuncio">Copiar texto</button>
            <button type="button" id="compartirAnuncio">Compartir</button>
        </section>
        <div id="catalogo"></div>
        <script src="app.js"></script>
    </body>
</html>
